<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header: Greeting, Date/Time, Custom Name & Theme Toggle -->
    <header class="header">
      <div class="greeting-block">
        <div class="greeting-row">
          <h1 id="greeting-text">Good Morning</h1>
          <button id="edit-name-btn" class="btn-icon" type="button" title="Set custom name" aria-label="Set custom name">✎</button>
        </div>
        <form id="name-form" class="name-form hidden">
          <input type="text" id="name-input" placeholder="Enter your name..." maxlength="30" autocomplete="off">
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
          <button type="button" id="cancel-name-btn" class="btn btn-ghost btn-sm">Cancel</button>
        </form>
        <p id="date-display" class="date-text"></p>
      </div>

      <div class="header-right">
        <div id="clock-display" class="clock-text">00:00:00</div>
        <button id="theme-toggle" class="btn btn-ghost" type="button" aria-label="Toggle Light/Dark mode">
          🌙 Dark Mode
        </button>
      </div>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="dashboard-grid">
      <!-- Left Column: Focus Timer & Quick Links -->
      <div class="left-column">
        <!-- Focus Timer -->
        <section class="card timer-card" aria-labelledby="timer-heading">
          <h2 id="timer-heading" class="card-title">Focus Timer</h2>
          <div id="timer-display" class="timer-display">25:00</div>
          <p id="timer-status" class="timer-status">Ready to focus</p>
          <div class="timer-controls">
            <button id="timer-start" class="btn btn-primary" type="button">Start</button>
            <button id="timer-stop" class="btn btn-secondary" type="button">Stop</button>
            <button id="timer-reset" class="btn btn-ghost" type="button">Reset</button>
          </div>
        </section>

        <!-- Quick Links -->
        <section class="card links-card" aria-labelledby="links-heading">
          <h2 id="links-heading" class="card-title">Quick Links</h2>
          <form id="link-form" class="link-form">
            <input type="text" id="link-name" placeholder="Site name (e.g. GitHub)" maxlength="25" required autocomplete="off">
            <input type="text" id="link-url" placeholder="URL (e.g. github.com)" required autocomplete="off">
            <button type="submit" class="btn btn-primary">Add Link</button>
          </form>
          <div id="links-list" class="links-list"></div>
        </section>
      </div>

      <!-- Right Column: To-Do List -->
      <section class="card todo-card" aria-labelledby="todo-heading">
        <div class="todo-header">
          <h2 id="todo-heading" class="card-title">To-Do List</h2>
          <span id="task-counter" class="task-counter">0/0 done</span>
        </div>

        <form id="todo-form" class="todo-form">
          <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="120" autocomplete="off" required>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="todo-feedback" class="feedback-text hidden" role="alert"></p>

        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-empty" class="empty-state">No tasks yet. Add one above to plan your day.</p>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
